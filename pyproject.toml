[project]
name = "audience-predictor"
version = "0.1.0"
description = "Predict a film's latent audience from narrative text before any ratings are observed"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.11",
    "jax>=0.4.31",
    "jaxlib>=0.4.31",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "optax>=0.2",
    "polars>=1.9",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "tqdm>=4.66",
]

[project.scripts]
audience-predictor = "audience_predictor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audience_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
